<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#002855">
<title>Pusat Referensi Regulasi · YEH</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>

<div id="viewBoot" class="boot"><img src="assets/logo.png" alt=""><span class="spinner"></span></div>

<main id="viewLogin" class="auth" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="assets/logo.png" alt="Logo Yayasan Eka Harap">
    <h1>Pusat Referensi Regulasi</h1>
    <p class="muted">Yayasan Eka Harap · khusus pegawai terdaftar</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>User ID</span>
        <input name="userId" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Sandi</span>
        <span class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle">Lihat</button></span></label>
      <p class="form-msg" id="loginMsg" role="alert"></p>
      <button class="btn primary block" type="submit">Masuk</button>
    </form>
    <p class="hint">Lupa sandi? Hubungi admin untuk diatur ulang.</p>
  </div>
</main>

<main id="viewChange" class="auth" hidden>
  <div class="auth-card" id="changeCard"></div>
</main>

<div id="viewApp" hidden>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnDrawer" type="button" aria-label="Daftar regulasi">☰</button>
    <a class="brand" href="#/"><img src="assets/logo.png" alt=""><span><strong>Pusat Referensi Regulasi</strong><small>Yayasan Eka Harap</small></span></a>
    <form class="topsearch" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Cari isi pasal di semua regulasi…" aria-label="Cari isi pasal" enterkeyhint="search">
      <button class="btn accent" type="submit">Cari</button>
    </form>
    <div class="menu-wrap">
      <button class="user-btn" id="btnMenu" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="avatar"></span><span class="user-name" id="userName"></span><span class="dots" aria-hidden="true">⋯</span>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <div class="menu-head"><strong id="menuName"></strong><small id="menuRole"></small></div>
        <button type="button" role="menuitem" data-act="admin" id="menuAdmin" hidden>Panel Admin</button>
        <button type="button" role="menuitem" data-act="password">Ganti sandi</button>
        <button type="button" role="menuitem" data-act="refresh">Muat ulang data</button>
        <div class="menu-sep"></div>
        <button type="button" role="menuitem" data-act="logout" class="danger">Keluar</button>
        <div class="menu-foot" id="menuVersion"></div>
      </div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Daftar regulasi">
      <div class="side-head">
        <input id="filterInput" type="search" placeholder="Saring judul regulasi…" aria-label="Saring judul">
        <select id="groupFilter" aria-label="Kategori"></select>
      </div>
      <nav id="regList" class="reglist"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <main class="content" id="content"></main>
  </div>
</div>

<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js?v=1.3.0"></script>
<script src="api.js?v=1.3.0"></script>
<script src="app.js?v=1.3.0"></script>
</body>
</html>
